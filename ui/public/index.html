<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crow Room</title>
  <link rel="icon" href="crow.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="room">
    <nav class="crew" aria-label="Crew">
      <div class="crew-mark" title="Crow Room"><img src="crow.svg" alt=""></div>
      <ul id="crew"></ul>
      <button id="new-session" class="quiet" title="Start a fresh session (runs the session-start hook again)">New</button>
    </nav>

    <main class="talk">
      <div id="stream" class="stream" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Talk to Crow" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
        <button id="stop" type="button" class="stop" hidden>Stop</button>
      </form>
    </main>

    <aside class="board" aria-label="Board">
      <section class="clock">
        <div id="time" class="time">--:--</div>
        <div id="date" class="date"></div>
      </section>
      <section>
        <h2>Coming up</h2>
        <ol id="events" class="events"></ol>
      </section>
      <section>
        <h2>Where things stand</h2>
        <div id="status" class="status"></div>
      </section>
      <section id="ghost-section">
        <h2>Ghost card</h2>
        <div id="ghost" class="ghost"></div>
      </section>
      <footer id="session-info" class="session-info"></footer>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
