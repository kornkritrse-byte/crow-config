<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crow Room</title>
  <link rel="icon" href="crow.svg">
  <link rel="stylesheet" href="style.css">
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
</head>
<body>
  <div class="room">
    <nav class="crew" aria-label="Crew">
      <div class="crew-mark" title="Crow Room"><img src="crow.svg" alt=""></div>
      <ul id="crew"></ul>
      <button id="new-session" class="quiet" title="Start a fresh session (runs the session-start hook again)">New</button>
    </nav>

    <main class="talk">
      <div id="stream" class="stream" aria-live="polite"></div>
      <button id="jump" class="jump" type="button" hidden>Jump to latest</button>
      <section id="todos" class="todos" hidden aria-label="Crow's task list"></section>
      <form id="composer" class="composer">
        <div class="field">
          <div id="attachments" class="attachments" hidden></div>
          <div class="box">
            <button id="attach" type="button" class="attach" title="Attach images, PDFs or text files (or paste / drop them)" aria-label="Attach files">
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M14.5 9.5 9 15a3.5 3.5 0 0 1-5-5l6.5-6.5a2.3 2.3 0 0 1 3.3 3.3L7.4 13.2a1.1 1.1 0 0 1-1.6-1.6L11.5 6"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Talk to Crow. Type / for commands, @ for files" autocomplete="off" aria-label="Message"></textarea>
          </div>
          <input id="file-input" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.csv,.json" hidden>
          <div id="popup" class="popup" role="listbox" hidden></div>
          <div class="hint">Enter to send, Shift+Enter for a new line, Esc to stop Crow</div>
        </div>
        <button id="send" type="submit">Send</button>
        <button id="stop" type="button" class="stop" hidden>Stop</button>
      </form>
    </main>

    <aside class="board" aria-label="Board">
      <div class="board-scroll">
        <section class="clock">
          <div id="time" class="time">--:--</div>
          <div id="date" class="date"></div>
        </section>
        <section>
          <h2>Coming up</h2>
          <ol id="events" class="events"></ol>
        </section>
        <section id="ghost-section">
          <h2>Ghost card</h2>
          <div id="ghost" class="ghost"></div>
        </section>
        <section>
          <h2>Where things stand</h2>
          <div id="status" class="status clamped"></div>
          <button id="status-more" type="button" class="link">Show all</button>
        </section>
      </div>
      <footer class="board-foot">
        <span class="label" id="mode-label">Mode</span>
        <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
          <button type="button" data-mode="auto" role="radio">Normal</button>
          <button type="button" data-mode="plan" role="radio">Plan first</button>
        </div>
        <label for="model">Model</label>
        <select id="model"></select>
        <div id="model-note" class="model-note"></div>
      </footer>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
